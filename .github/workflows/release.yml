name: release

# Publishes a release when you push a version tag, e.g.  git tag v1.9.1  then  git push origin v1.9.1
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single file
        working-directory: ReleaseSync
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ../publish
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/ReleaseSync.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ReleaseSync.exe" | Out-File -Encoding ascii publish/ReleaseSync.exe.sha256
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/ReleaseSync.exe publish/ReleaseSync.exe.sha256 --title "ReleaseSync ${{ github.ref_name }}" --notes-file .github/release-notes.md --generate-notes
