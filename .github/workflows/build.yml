name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # the shared core is plain .NET, so its tests also run on Linux — a check that nothing Windows-only sneaks into it
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test ReleaseSync.Core.Tests -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        working-directory: ReleaseSync
        run: dotnet build -c Release
      - name: Publish single file
        working-directory: ReleaseSync
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ../publish
      - uses: actions/upload-artifact@v4
        with:
          name: ReleaseSync-win-x64
          path: publish/ReleaseSync.exe
